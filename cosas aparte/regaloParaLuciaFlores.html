<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un jardín amarillo 🌻</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
      background:
        radial-gradient(circle at 50% 30%, #fff9b0 0%, transparent 25%),
        linear-gradient(180deg, #87ceeb 0%, #d8f5ff 45%, #b8e986 100%);
      color: #513600;
    }

    /* Cielo */
    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .sun {
      position: absolute;
      width: 150px;
      height: 150px;
      right: 10%;
      top: 8%;
      border-radius: 50%;
      background: #fff36a;
      box-shadow:
        0 0 40px #ffe600,
        0 0 100px #ffd900,
        0 0 160px rgba(255, 220, 0, .4);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    /* Nubes */
    .cloud {
      position: absolute;
      width: 180px;
      height: 55px;
      border-radius: 50px;
      background: rgba(255,255,255,.75);
      filter: blur(1px);
      animation: clouds 35s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      width: 80px;
      height: 80px;
      left: 30px;
      bottom: 0;
    }

    .cloud::after {
      width: 100px;
      height: 100px;
      right: 20px;
      bottom: 0;
    }

    .cloud:nth-child(2) {
      top: 25%;
      left: -250px;
      animation-duration: 45s;
      transform: scale(.8);
    }

    .cloud:nth-child(3) {
      top: 12%;
      left: -400px;
      animation-duration: 55s;
      animation-delay: 8s;
      transform: scale(.6);
    }

    @keyframes clouds {
      from {
        transform: translateX(-250px) scale(.9);
      }
      to {
        transform: translateX(calc(100vw + 500px)) scale(.9);
      }
    }

    /* Contenido */
    .content {
      position: relative;
      z-index: 5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-bottom: 180px;
    }

    h1 {
      font-size: clamp(3rem, 9vw, 7rem);
      color: #fff8a5;
      text-shadow:
        0 4px 0 #d99b00,
        0 8px 20px rgba(101, 63, 0, .35);
      animation: title 3s ease-in-out infinite;
    }

    @keyframes title {
      0%, 100% {
        transform: translateY(0) rotate(-1deg);
      }
      50% {
        transform: translateY(-8px) rotate(1deg);
      }
    }

    p {
      margin-top: 15px;
      font-size: clamp(1rem, 2vw, 1.4rem);
      color: #725000;
      background: rgba(255,255,255,.35);
      padding: 10px 22px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
    }

    /* Campo */
    .ground {
      position: fixed;
      z-index: 2;
      bottom: 0;
      width: 100%;
      height: 220px;
      background:
        radial-gradient(ellipse at center, #8fce42 0%, #4d9c35 75%);
      border-radius: 50% 50% 0 0 / 25% 25% 0 0;
      box-shadow: 0 -20px 50px rgba(48, 100, 25, .25);
    }

    /* Flores */
    .garden {
      position: fixed;
      z-index: 4;
      bottom: 50px;
      left: 0;
      width: 100%;
      height: 260px;
      pointer-events: none;
    }

    .flower {
      position: absolute;
      bottom: 0;
      width: 100px;
      height: 230px;
      transform-origin: bottom center;
      animation: sway 4s ease-in-out infinite;
    }

    .flower:nth-child(1) {
      left: 5%;
      transform: scale(.8);
      animation-delay: -.5s;
    }

    .flower:nth-child(2) {
      left: 20%;
      transform: scale(1.15);
      animation-delay: -1.5s;
    }

    .flower:nth-child(3) {
      left: 40%;
      transform: scale(.9);
      animation-delay: -.8s;
    }

    .flower:nth-child(4) {
      left: 62%;
      transform: scale(1.2);
      animation-delay: -2s;
    }

    .flower:nth-child(5) {
      left: 82%;
      transform: scale(.85);
      animation-delay: -1s;
    }

    @keyframes sway {
      0%, 100% {
        transform: rotate(-3deg);
      }
      50% {
        transform: rotate(3deg);
      }
    }

    /* Tallo */
    .stem {
      position: absolute;
      bottom: 0;
      left: 48px;
      width: 8px;
      height: 175px;
      background: linear-gradient(90deg, #28752e, #58a83b, #216326);
      border-radius: 10px;
    }

    /* Hojas */
    .leaf {
      position: absolute;
      width: 65px;
      height: 30px;
      background: linear-gradient(135deg, #63bd42, #287a2c);
      border-radius: 100% 0 100% 0;
    }

    .leaf.left {
      left: -5px;
      bottom: 75px;
      transform: rotate(-25deg);
    }

    .leaf.right {
      left: 45px;
      bottom: 105px;
      transform: rotate(25deg) scaleX(-1);
    }

    /* Cabeza de la flor */
    .head {
      position: absolute;
      left: 0;
      top: 0;
      width: 100px;
      height: 100px;
    }

    .petal {
      position: absolute;
      width: 47px;
      height: 68px;
      left: 27px;
      top: 15px;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(135deg, #fff76a, #ffc400);
      box-shadow:
        inset -5px -8px 10px rgba(212, 144, 0, .3),
        0 0 12px rgba(255, 217, 0, .35);
      transform-origin: 50% 35px;
    }

    .petal:nth-child(1) { transform: rotate(0deg); }
    .petal:nth-child(2) { transform: rotate(45deg); }
    .petal:nth-child(3) { transform: rotate(90deg); }
    .petal:nth-child(4) { transform: rotate(135deg); }
    .petal:nth-child(5) { transform: rotate(180deg); }
    .petal:nth-child(6) { transform: rotate(225deg); }
    .petal:nth-child(7) { transform: rotate(270deg); }
    .petal:nth-child(8) { transform: rotate(315deg); }

    .center {
      position: absolute;
      left: 30px;
      top: 30px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, #ffdc54, #9b5900 70%);
      box-shadow:
        inset 0 0 0 5px #e7a400,
        0 4px 10px rgba(90,50,0,.35);
      z-index: 5;
    }

    /* Pétalos que caen */
    .falling-petals span {
      position: absolute;
      top: -50px;
      width: 14px;
      height: 20px;
      background: #ffd91a;
      border-radius: 100% 0 100% 0;
      opacity: .8;
      animation: fall linear infinite;
    }

    .falling-petals span:nth-child(1) {
      left: 8%;
      animation-duration: 8s;
    }

    .falling-petals span:nth-child(2) {
      left: 22%;
      animation-duration: 11s;
      animation-delay: 2s;
    }

    .falling-petals span:nth-child(3) {
      left: 37%;
      animation-duration: 9s;
      animation-delay: 4s;
    }

    .falling-petals span:nth-child(4) {
      left: 53%;
      animation-duration: 12s;
      animation-delay: 1s;
    }

    .falling-petals span:nth-child(5) {
      left: 71%;
      animation-duration: 10s;
      animation-delay: 3s;
    }

    .falling-petals span:nth-child(6) {
      left: 90%;
      animation-duration: 13s;
      animation-delay: 5s;
    }

    @keyframes fall {
      0% {
        transform: translateY(-50px) rotate(0deg);
      }
      100% {
        transform: translateY(110vh) translateX(100px) rotate(720deg);
      }
    }

    /* Brillos */
    .sparkle {
      position: fixed;
      z-index: 3;
      color: #fffbd0;
      font-size: 25px;
      animation: sparkle 2s ease-in-out infinite;
    }

    .s1 { left: 15%; top: 30%; }
    .s2 { left: 75%; top: 40%; animation-delay: .5s; }
    .s3 { left: 55%; top: 18%; animation-delay: 1s; }
    .s4 { left: 30%; top: 20%; animation-delay: 1.5s; }

    @keyframes sparkle {
      0%, 100% {
        opacity: .2;
        transform: scale(.5) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.2) rotate(90deg);
      }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .sun {
        width: 100px;
        height: 100px;
      }

      .ground {
        height: 180px;
      }

      .garden {
        bottom: 20px;
        transform: scale(.75);
        transform-origin: bottom;
      }

      p {
        max-width: 85%;
      }
    }
  </style>
</head>
